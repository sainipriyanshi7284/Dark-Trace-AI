
name: CyberSentinel Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and package EXE
        run: npm run dist

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "release/*.exe"
          if (-not $files) {
            throw "No EXE installer found in release/"
          }
          Get-ChildItem "release/*.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CyberSentinel ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
