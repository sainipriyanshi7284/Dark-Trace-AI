
name: Build CyberSentinel Windows EXE

on:
  push:
    branches:
      - main
      - feature_modules
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      - name: Package Windows EXE
        run: npm run dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CyberSentinel-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
