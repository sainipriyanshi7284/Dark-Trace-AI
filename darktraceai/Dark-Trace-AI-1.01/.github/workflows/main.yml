name: Dark Trace AI Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "Cybersecurity SOC Dashboard"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Cybersecurity SOC Dashboard/package-lock.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and package EXE
        run: npm run dist

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          $nsisExes = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsisExes) {
            Copy-Item -Path $nsisExes.FullName -Destination release/
          }
          $releaseExes = Get-ChildItem "release/*.exe"
          if (-not $releaseExes) {
            throw "No EXE installer found in release/ or src-tauri/target/release/bundle/nsis/"
          }
          $releaseExes

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Dark Trace AI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Cybersecurity SOC Dashboard/release/*.exe
